name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build arm64 Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk inha-app-v1.0.1-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inha-app-arm64-release-apk
          path: inha-app-v1.0.1-arm64.apk

      - name: Attach APK to v1.0.1 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            gh release upload v1.0.1 inha-app-v1.0.1-arm64.apk --clobber
          else
            gh release create v1.0.1 inha-app-v1.0.1-arm64.apk --title "Inha App v1.0.1 (arm64-v8a)" --notes "Исправлен мгновенный вылет на старте (R8 удалял WorkDatabase_Impl для WorkManager)."
          fi
