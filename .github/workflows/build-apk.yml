name: Build & Release Android APK & iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create/update GitHub Release for pubspec.yaml version'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      ios_build_name: ${{ steps.ver.outputs.ios_build_name }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version & tag
        id: ver
        run: |
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            BASE_TAG_VER="${VERSION%%-*}"
            IOS_BUILD_NAME="$BASE_TAG_VER"
            if [ "$BASE_TAG_VER" != "$PUBSPEC_VER" ]; then
              echo "::warning::Tag version ($VERSION) differs from pubspec.yaml ($PUBSPEC_VER); building artifacts with --build-name=$VERSION"
            fi
          else
            VERSION="$PUBSPEC_VER"
            TAG="v${VERSION}"
            IOS_BUILD_NAME="$PUBSPEC_VER"
          fi

          if echo "$TAG" | grep -q '-'; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ios_build_name=$IOS_BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=$TAG version=$VERSION ios_build_name=$IOS_BUILD_NAME prerelease=$IS_PRERELEASE"

  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release signing configured."
          else
            echo "Release keystore secrets not set; using debug signing fallback."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-pub

      - name: Build arm64 Release APK
        run: flutter build apk --release --target-platform android-arm64 --build-name="${{ needs.resolve-version.outputs.version }}" --build-number=$((100 + GITHUB_RUN_NUMBER))

      - name: Package APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "inha-app-${{ needs.resolve-version.outputs.tag }}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: inha-app-${{ needs.resolve-version.outputs.tag }}-arm64.apk

  build-ios:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-name="${{ needs.resolve-version.outputs.ios_build_name }}" --build-number=$((100 + GITHUB_RUN_NUMBER))

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qr "../../inha-app-${{ needs.resolve-version.outputs.tag }}-ios-unsigned.ipa" Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipa
          path: inha-app-${{ needs.resolve-version.outputs.tag }}-ios-unsigned.ipa

  publish-release:
    needs: [resolve-version, build-android, build-ios]
    if: github.ref_type == 'tag' || inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh release-assets
          TAG="${{ needs.resolve-version.outputs.tag }}"
          APK="release-assets/inha-app-${TAG}-arm64.apk"
          IPA="release-assets/inha-app-${TAG}-ios-unsigned.ipa"
          IS_PRERELEASE="${{ needs.resolve-version.outputs.is_prerelease }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$IPA" --clobber
          else
            ARGS=("$TAG" "$APK" "$IPA" "--target" "${{ github.sha }}" "--title" "Inha App $TAG (Android & iOS)" "--generate-notes")
            if [ "$IS_PRERELEASE" = "true" ]; then
              ARGS+=("--prerelease")
            fi
            gh release create "${ARGS[@]}"
          fi
