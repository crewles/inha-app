name: inhahub
description: "Inha App — Android client for Inha University (Tashkent): eClass, INS, EduPage Timetable with Material 3 and local SQLite."
publish_to: 'none'
version: 1.2.4+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  html: ^0.15.4
  xml: ^6.5.0
  charset: ^2.0.1
  dynamic_color: ">=1.7.0 <1.9.0"
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  file_picker: ^10.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_android: ">=2.2.15 <2.3.0"

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
